# Dev Postgres for local work and integration tests (`docker compose up -d`).
# Postgres 18: Procrastinate's CI tests it; langgraph-checkpoint-postgres's CI covers 15/16,
# so our integration suite is what validates 18. The pgvector image (Debian/glibc) ships the
# extension for the future [rag] extra. Dev-only credentials; never reuse them elsewhere.
services:
  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: graph_agent
      POSTGRES_PASSWORD: graph_agent
      POSTGRES_DB: graph_agent
    ports:
      # Non-default host port so it does not clash with a local Postgres on 5432.
      - "127.0.0.1:54329:5432"
    volumes:
      # Postgres 18 images keep PGDATA in a versioned subdirectory of this path.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U graph_agent -d graph_agent"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  pgdata:
