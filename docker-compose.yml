# Dev Postgres for local work and integration tests (`docker compose up -d`).
# Postgres 18: Procrastinate's CI tests it; langgraph-checkpoint-postgres's CI covers 15/16,
# so our integration suite is what validates 18. The pgvector image (Debian/glibc) ships the
# extension for the future [rag] extra. Dev-only credentials; never reuse them elsewhere.
services:
  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ranvier
      POSTGRES_PASSWORD: ranvier
      POSTGRES_DB: ranvier
    ports:
      # Non-default host port below 49152: no clash with a local 5432 nor with the port ranges Windows/Hyper-V reserves dynamically (WSL).
      - "127.0.0.1:25432:5432"
    volumes:
      # Postgres 18 images keep PGDATA in a versioned subdirectory of this path.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ranvier -d ranvier"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  pgdata:
