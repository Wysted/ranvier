[project]
name = "graph-agent"
version = "0.1.0"
description = "Platform package and starter for general AI flows on LangGraph"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.2",
    "genai-prices>=0.0.60",
    "httpx>=0.28.1,<1",
    "langchain==1.4.*",
    "langgraph>=1.2.15,<2",
    "langgraph-checkpoint-postgres>=3.2.0,<4",
    "mcp>=2.3,<3",
    "procrastinate>=3,<4",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.16.0",
    "pyyaml>=6,<7",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
openai = ["langchain-openai>=1.7.2,<2"]
anthropic = ["langchain-anthropic>=1.7.6,<2"]
ollama = ["langchain-ollama>=1.1.0,<2"]
otel = [
    "openinference-instrumentation-langchain>=0.1.79,<0.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1,<2",
    "opentelemetry-sdk>=1.45.1,<2",
]

[project.scripts]
graph-agent = "graph_agent._internal.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graph_agent"]
