[project]
name = "ranvier"
version = "0.1.0"
description = "Platform package and starter for general AI flows on LangGraph"
requires-python = ">=3.13"
dependencies = [
    "croniter>=6,<7",
    "fastapi>=0.162.0,<0.163",
    "genai-prices>=0.2.1,<0.3",
    "httpx>=0.28.1,<1",
    "httpx2>=2.16,<3",
    "langchain==1.4.*",
    "langgraph>=1.2.15,<2",
    "langgraph-checkpoint-postgres>=3.2.0,<4",
    "mcp>=2.3,<3",
    "procrastinate>=3,<4",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.16.0",
    "pyyaml>=6,<7",
    "uvicorn[standard]>=0.54.0,<0.55",
]

[project.optional-dependencies]
openai = ["langchain-openai>=1.7.2,<2"]
anthropic = ["langchain-anthropic>=1.7.6,<1.8"]
ollama = ["langchain-ollama>=1.1.0,<2"]
otel = [
    "openinference-instrumentation-langchain>=0.1.79,<0.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1,<2",
    "opentelemetry-sdk>=1.45.1,<2",
]

[project.scripts]
ranvier = "ranvier._internal.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ranvier"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "../../examples/src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "TID", "RUF"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"mcp".msg = "MCP SDK is confined to ranvier/_internal/agents/mcp.py (design section 2)."
"mcp_types".msg = "MCP wire types are confined to ranvier/_internal/agents/mcp.py (design section 2)."
"httpx2".msg = "httpx2 is confined to ranvier/_internal/agents/mcp.py and llm.py (design section 2)."
"langchain.mcp".msg = "Use the McpToolSource port; langchain.mcp is banned."
"fastmcp".msg = "fastmcp is banned (design section 2)."
"langchain_mcp_adapters".msg = "Archived package; use the McpToolSource port."
"langgraph.prebuilt.create_react_agent".msg = "Deprecated; use langchain.agents.create_agent."
"langgraph_supervisor".msg = "Banned; build supervisors with plain StateGraph."
"asyncpg".msg = "Postgres access is psycopg 3 only."
"fastapi.responses.ORJSONResponse".msg = "Deprecated in FastAPI."

[tool.ruff.lint.per-file-ignores]
# shortcut: ruff cannot scope one banned module per path, so tests/ switch off the whole
# banned-api table (incl. the "everywhere" bans); split by path if that ever bites.
# agents/mcp.py gets no file ignore: its mcp/httpx2 imports carry a line-level `# noqa: TID251`.
"tests/**" = ["TID251"]

[tool.mypy]
strict = true
files = ["src", "tests", "../../examples/src", "../../examples/tests"]
mypy_path = ["src", "tests"]
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--import-mode=importlib", "-m", "not integration"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error", "ignore::DeprecationWarning:langsmith.*"]
markers = ["integration: needs Postgres (docker compose); run with -m integration"]

[tool.importlinter]
root_packages = ["ranvier", "examples"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "C1 layers"
type = "layers"
containers = ["ranvier._internal"]
# Parenthesized layers do not exist yet. cli sits above api and worker: it starts the worker (T25).
layers = [
    "cli",
    "api | worker",
    "bootstrap",
    "runtime",
    "agents",
    "llm | limits | usage | observability | (queue)",
    "db | config",
]

[[tool.importlinter.contracts]]
name = "C2 internals never import the testing facade"
type = "layers"
containers = ["ranvier"]
# testing may import _internal, never the reverse. `testing` does not exist yet.
layers = ["(testing)", "_internal"]

[[tool.importlinter.contracts]]
name = "C3a fastapi and starlette only in api"
type = "forbidden"
source_modules = ["ranvier"]
forbidden_modules = ["fastapi", "starlette"]
ignore_imports = [
    "ranvier._internal.api -> fastapi",
    "ranvier._internal.api.** -> fastapi",
    "ranvier._internal.api -> starlette",
    "ranvier._internal.api.** -> starlette",
]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "C3b uvicorn only in api and cli"
type = "forbidden"
source_modules = ["ranvier"]
forbidden_modules = ["uvicorn"]
ignore_imports = [
    "ranvier._internal.api -> uvicorn",
    "ranvier._internal.api.** -> uvicorn",
    "ranvier._internal.cli -> uvicorn",
]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "C4 procrastinate only in queue and worker"
type = "forbidden"
source_modules = ["ranvier"]
forbidden_modules = ["procrastinate"]
ignore_imports = [
    "ranvier._internal.queue -> procrastinate",
    "ranvier._internal.queue.** -> procrastinate",
    "ranvier._internal.worker -> procrastinate",
    "ranvier._internal.worker.** -> procrastinate",
]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "C5a langgraph only in runtime, agents, facade and testing"
type = "forbidden"
source_modules = ["ranvier"]
forbidden_modules = ["langgraph"]
ignore_imports = [
    "ranvier -> langgraph",
    "ranvier._internal.runtime -> langgraph",
    "ranvier._internal.runtime.** -> langgraph",
    "ranvier._internal.agents -> langgraph",
    "ranvier._internal.agents.** -> langgraph",
    "ranvier.testing -> langgraph",
    "ranvier.testing.** -> langgraph",
]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "C5b langchain only in runtime, agents, llm, usage, facade and testing"
type = "forbidden"
source_modules = ["ranvier"]
forbidden_modules = ["langchain", "langchain_core"]
ignore_imports = [
    "ranvier -> langchain",
    "ranvier -> langchain_core",
    "ranvier._internal.runtime -> langchain",
    "ranvier._internal.runtime -> langchain_core",
    "ranvier._internal.runtime.** -> langchain",
    "ranvier._internal.runtime.** -> langchain_core",
    "ranvier._internal.agents -> langchain",
    "ranvier._internal.agents -> langchain_core",
    "ranvier._internal.agents.** -> langchain",
    "ranvier._internal.agents.** -> langchain_core",
    "ranvier._internal.llm -> langchain",
    "ranvier._internal.llm -> langchain_core",
    "ranvier._internal.llm.** -> langchain",
    "ranvier._internal.llm.** -> langchain_core",
    "ranvier._internal.usage -> langchain",
    "ranvier._internal.usage -> langchain_core",
    "ranvier._internal.usage.** -> langchain",
    "ranvier._internal.usage.** -> langchain_core",
    "ranvier.testing -> langchain",
    "ranvier.testing -> langchain_core",
    "ranvier.testing.** -> langchain",
    "ranvier.testing.** -> langchain_core",
]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "C5c provider integrations only in llm"
type = "forbidden"
source_modules = ["ranvier"]
forbidden_modules = ["langchain_openai", "langchain_anthropic", "langchain_ollama"]
ignore_imports = [
    "ranvier._internal.llm -> langchain_openai",
    "ranvier._internal.llm -> langchain_anthropic",
    "ranvier._internal.llm -> langchain_ollama",
    "ranvier._internal.llm.** -> langchain_openai",
    "ranvier._internal.llm.** -> langchain_anthropic",
    "ranvier._internal.llm.** -> langchain_ollama",
]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "C6a opentelemetry and openinference only in observability.otlp"
type = "forbidden"
source_modules = ["ranvier"]
forbidden_modules = ["opentelemetry", "openinference"]
ignore_imports = [
    "ranvier._internal.observability.otlp -> opentelemetry",
    "ranvier._internal.observability.otlp -> openinference",
    "ranvier._internal.observability.otlp.** -> opentelemetry",
    "ranvier._internal.observability.otlp.** -> openinference",
]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "C6b only observability.tracing imports observability.otlp"
type = "protected"
protected_modules = ["ranvier._internal.observability.otlp"]
allowed_importers = ["ranvier._internal.observability.tracing"]

[[tool.importlinter.contracts]]
name = "C2b examples use only the public facade"
type = "forbidden"
source_modules = ["examples"]
forbidden_modules = ["ranvier._internal"]
# The facade itself imports _internal: only a direct import by an example is a violation.
allow_indirect_imports = true
