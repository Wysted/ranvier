[project]
name = "ranvier-examples"
version = "0.0.0"
description = "Example flows for ranvier (not published)"
requires-python = ">=3.13"
license = "MIT"
dependencies = ["ranvier"]

[tool.uv.sources]
ranvier = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/examples"]
