[project]
name = "graph-agent-examples"
version = "0.0.0"
description = "Example flows for graph-agent (not published)"
requires-python = ">=3.13"
dependencies = ["graph-agent"]

[tool.uv.sources]
graph-agent = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/examples"]
