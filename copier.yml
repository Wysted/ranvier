# Copier template for graph-agent product repos. One git tag versions the package and this
# starter, so `copier update` and the dependency pin move together (design.md section 2).
_subdirectory: starter
_min_copier_version: "9.0.0"

project_name:
  type: str
  help: Project name (distribution name, kebab-case)
  validator: >-
    {% if not (project_name | regex_search('^[a-z][a-z0-9-]*$')) %}
    Use lowercase letters, digits and hyphens, starting with a letter.
    {% endif %}

package_name:
  type: str
  help: Python package name (import name, snake_case)
  default: "{{ project_name | replace('-', '_') }}"
  validator: >-
    {% if not (package_name | regex_search('^[a-z][a-z0-9_]*$')) %}
    Use lowercase letters, digits and underscores, starting with a letter.
    {% elif package_name == 'graph_agent' or package_name in [
      'False', 'None', 'True', 'and', 'as', 'assert', 'async', 'await', 'break', 'class',
      'continue', 'def', 'del', 'elif', 'else', 'except', 'finally', 'for', 'from', 'global',
      'if', 'import', 'in', 'is', 'lambda', 'nonlocal', 'not', 'or', 'pass', 'raise', 'return',
      'try', 'while', 'with', 'yield'] %}
    Reserved: it is 'graph_agent' or a Python keyword.
    {% endif %}

graph_agent_tag:
  type: str
  help: graph-agent git tag to pin (also the starter version to update to)
  default: v0.1.0

graph_agent_repo:
  type: str
  help: Git URL of the graph-agent repository (the git host is not decided yet; no default)
