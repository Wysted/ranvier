[project]
name = "ranvier-workspace"
version = "0.0.0"
description = "uv workspace root for ranvier (not published)"
requires-python = ">=3.13"
license = "MIT"
dependencies = []

[tool.uv.workspace]
members = ["packages/core", "examples"]

[tool.uv.sources]
ranvier = { workspace = true }
ranvier-examples = { workspace = true }

[dependency-groups]
dev = [
    "ranvier[openai,anthropic,ollama,otel]",
    "ranvier-examples",
    "blockbuster>=1.5",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "types-croniter>=6",
    "types-pyyaml>=6",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]
